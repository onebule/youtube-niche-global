name: Build Creator OS desktop installers
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish tested installers and update feed as a formal Release'
        type: boolean
        default: false
  push:
    branches: [creator-os-desktop-build]
    paths: ['creator-os-desktop/**', '.github/workflows/build-desktop.yml']
concurrency:
  group: creator-os-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: macos-15
            arch: arm64
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: creator-os-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/prepare-desktop.mjs
      - run: npm test
      - run: npx electron . --smoke-test --disable-gpu
        timeout-minutes: 2
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/smoke-packaged.mjs
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: Creator-OS-${{ matrix.target }}-${{ matrix.arch }}-installers
          path: |
            creator-os-desktop/desktop-dist/*.exe
            creator-os-desktop/desktop-dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: node creator-os-desktop/scripts/release-desktop.mjs release
        env:
          GH_TOKEN: ${{ github.token }}
