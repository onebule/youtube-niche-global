name: Build Creator OS desktop installers
on:
  workflow_dispatch:
  push:
    branches: [creator-os-desktop-build]
    paths: ['creator-os-desktop/**', '.github/workflows/build-desktop.yml']
concurrency:
  group: creator-os-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: win
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: macos-15
            arch: arm64
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: creator-os-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/prepare-desktop.mjs
      - run: npm test
      - run: npx electron . --smoke-test --disable-gpu
        timeout-minutes: 2
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Creator-OS-${{ matrix.target }}-${{ matrix.arch }}-installers
          path: |
            creator-os-desktop/desktop-dist/*.exe
            creator-os-desktop/desktop-dist/*.dmg
            creator-os-desktop/desktop-dist/*.zip
          if-no-files-found: error
          retention-days: 14
