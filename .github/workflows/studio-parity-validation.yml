name: Studio Parity Validation (Read Only)

on:
  pull_request:
    paths:
      - 'signalcraft/**'
      - '.github/workflows/studio-parity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never enable paid execution or the preview on CI.
      STUDIO_PARITY_PREVIEW: disabled
      AGENT_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    defaults:
      run:
        working-directory: signalcraft
    steps:
      - name: Checkout read-only branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.18.3'
          run_install: false
      - name: Install lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Run no-network Studio contract tests
        run: node --experimental-strip-types --test tests/studio-agent-draft.test.mjs tests/studio-workflow-plan.test.mjs tests/infinite-canvas.test.mjs
      - name: Run existing full test suite
        run: pnpm test
      - name: TypeScript check
        run: pnpm typecheck
      - name: Production build validation (no deployment)
        run: pnpm build
