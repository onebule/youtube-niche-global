name: Studio Parity Validation (Read Only)

on:
  pull_request:
    paths:
      - 'signalcraft/**'
      - '.github/workflows/studio-parity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never enable paid execution or the preview on CI.
      STUDIO_PARITY_PREVIEW: disabled
      AGENT_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    defaults:
      run:
        working-directory: signalcraft
    steps:
      - name: Checkout read-only branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.18.3'
          run_install: false
      - name: Install lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Run no-network Studio contract tests
        run: node --experimental-strip-types --test tests/studio-agent-draft.test.mjs tests/studio-agent-tools.test.mjs tests/studio-agent-plan-bridge.test.mjs tests/studio-workflow-plan.test.mjs tests/studio-mock-runtime.test.mjs tests/studio-mock-checkpoint.test.mjs tests/infinite-canvas.test.mjs
      - name: Run existing full test suite
        run: pnpm test
      - name: TypeScript check
        run: pnpm typecheck
      - name: Production build validation (no deployment)
        run: pnpm build
      - name: Verify disabled and enabled preview HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          STUDIO_PARITY_PREVIEW=disabled pnpm exec next start -p 3107 >/tmp/studio-off.log 2>&1 &
          OFF_PID=$!
          STUDIO_PARITY_PREVIEW=enabled pnpm exec next start -p 3108 >/tmp/studio-on.log 2>&1 &
          ON_PID=$!
          trap 'kill "$OFF_PID" "$ON_PID" 2>/dev/null || true' EXIT
          STUDIO_SMOKE_BASE_URL=http://127.0.0.1:3107 STUDIO_SMOKE_EXPECT_STATUS=404 node scripts/studio-preview-http-smoke.mjs
          STUDIO_SMOKE_BASE_URL=http://127.0.0.1:3108 STUDIO_SMOKE_EXPECT_STATUS=200 node scripts/studio-preview-http-smoke.mjs
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$BROWSER_BIN" ]]; then echo "Headless Chrome unavailable"; exit 1; fi
          mkdir -p /tmp/studio-browser-artifacts
          "$BROWSER_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-allow-origins='*' --remote-debugging-port=9223 \
            --user-data-dir=/tmp/studio-parity-cdp \
            http://127.0.0.1:3108/studio-parity/canvas >/tmp/studio-browser.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$OFF_PID" "$ON_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          STUDIO_BROWSER_ARTIFACT_DIR=/tmp/studio-browser-artifacts node scripts/studio-browser-e2e.mjs
      - name: Upload non-sensitive studio browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-e2e
          path: /tmp/studio-browser-artifacts/studio-browser-validated.png
          if-no-files-found: ignore
          retention-days: 7
