enes[${i}][${k}]=this.value;Workbench.sync(scenes)">${esc(t)}</textarea></td>`).join('')}<td>${sceneStatus(i)}<p style="margin-top:15px;font-size:11px"><button onclick="sendScenes('image',${i})">生成图片</button><button onclick="sendScenes('video',${i})">生成视频</button><button onclick="viewSceneJobs(${i})">查看素材</button><button onclick="deleteScene(${i})">删除</button></p></td></tr>`).join('')}</tbody></table></div></div><p class="section-note">勾选分镜后加入批量队列；在生成中心选择模型并手动启动。分镜已自动保存至本机。</p>`}let scenes=Workbench.init([['改变人生，往往始于一个微小的行动。','清晨，阳光洒进安静的书房，桌面上放着一本翻开的书。自然光，电影质感，16:9。','镜头缓慢推进，从窗边的光影移动至书页。'],['持续积累，时间会给你答案。','一株绿色幼苗生长在窗台的陶盆中，远景是安静的城市。细腻写实，柔和光线。','固定镜头，光影缓慢变化，叶片随微风轻轻摇动。'],['做一个长期主义者，把今天交给行动。','黄昏时分，一个人沿着山间小路坚定向前。开阔构图，暖色，电影摄影。','镜头从背后跟随人物，缓慢拉远展示远处群山。']]);function assets(){return heading('资产生成','从一篇文案，到完整的发布素材。',btn('AI 生成素材',"openTextStudio()",false,'sparkles')+btn('保存资产','saveAsset()',true,'device-floppy'))+`<div class="editor-grid"><section class="card pad"><h2>创作文案</h2><label class="field" for="script">正文内容</label><textarea id="script" style="height:360px" oninput="asset.script=this.value;autoSaveAsset()">${esc(asset.script)}</textarea><div class="statusline"><span id="assetSaveStatus">编辑后自动保存至当前浏览器。</span></div><label class="field">所属频道</label><select style="width:100%"><option>慢慢生长</option><option>认知之外</option><option>生活提案</option></select></section><section class="card pad"><h2>发布素材</h2><label class="field" for="assettitle">视频标题</label><input id="assettitle" style="width:100%" value="${esc(asset.title)}" oninput="asset.title=this.value;autoSaveAsset()"><label class="field" for="assetdesc">内容简介</label><textarea id="assetdesc" rows="4" oninput="asset.desc=this.value;autoSaveAsset()">${esc(asset.desc)}</textarea><label class="field" for="assetcomment">置顶评论</label><textarea id="assetcomment" rows="2" oninput="asset.comment=this.value;autoSaveAsset()">${esc(asset.comment)}</textarea><label class="field" for="assetcommunity">社区贴文</label><textarea id="assetcommunity" rows="3" oninput="asset.community=this.value;autoSaveAsset()">${esc(asset.community||'')}</textarea><label class="field" for="coverprompt">封面提示词</label><textarea id="coverprompt" rows="3" oninput="asset.coverPrompt=this.value;autoSaveAsset()">${esc(asset.coverPrompt||'')}</textarea><label class="field">封面素材</label><div class="empty-art">${icon('photo-plus')}上传一张封面，预览发布效果<br><input aria-label="上传封面" type="file" accept="image/*" onchange="previewImage(this)" style="margin-top:15px;max-width:100%"><img id="cover" alt="封面预览" style="display:none;width:100%;margin-top:16px;border-radius:7px"></div><button onclick="copyAsset()">${icon('copy')} 复制发布素材</button></section></div>`}function demoReport(){return heading('运营周报','2026.10.12 — 2026.10.18 · 第 42 周',btn('导出周报','downloadReport()',false,'download'))+stats()+`<div class="grid"><section class="card pad report"><h2>本周复盘</h2><div class="report-banner" style="margin-top:20px"><b>先把节奏跑顺，再把好内容放大。</b><p style="font-size:12px;margin-top:8px">本周发布 13 条视频，新增订阅 197 人。持续发布和选题复用，带来了更稳定的增长。</p></div><h3>做得好的地方</h3><ul><li>「慢慢生长」连续发布，个人成长话题表现稳定。</li><li>长期主义主题的新片播放，达到同期基准的 6.7 倍。</li><li>本周 3 条视频表现优异，值得进一步拆解。</li></ul><h3>下周行动</h3><ul><li>优先复盘高表现视频的标题、开头与选题结构。</li><li>完成剩余视频任务，让发布节奏保持稳定。</li><li>对「认知之外」进行封面与标题的小范围测试。</li></ul></section><section class="card pad report"><h2>需要关注</h2><h3>${badge('01','amber')} 发布目标还差 3 条</h3><p>本周完成 13 / 16 条。建议缩小并行项目数量，为重点视频预留制作时间。</p><h3>${badge('02','amber')} 认知之外增长放缓</h3><p>检查近期选题是否过于分散，并对比同主题视频在发布后 24 小时的表现。</p><h3>${badge('03','green')} 复用有效内容结构</h3><p>围绕「停止内耗」「成长系统」安排延伸选题，观察连续内容的订阅转化。</p><p class="section-note" style="margin-top:30px">本周报基于演示数据编写，供界面与工作流程体验。</p></section></div>`}function render(){if(!pages.some(x=>x[0]===page))page='overview';document.getElementById('nav').innerHTML=pages.map((x,i)=>`${i===0?'<div class="group">WORKSPACE / 工作空间</div>':i===2?'<div class="group">CONTENT / 内容运营</div>':''}<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${icon(x[1])}${x[2]}${x[0]==='tasks'?'<span class="count">'+tasks.filter(t=>!t.done).length+'</span>':''}</button>`).join('');document.getElementById('crumb').textContent=pages.find(x=>x[0]===page)[2];document.getElementById('mobile').innerHTML=pages.map(x=>`<option value="${x[0]}" ${x[0]===page?'selected':''}>${x[2]}</option>`).join('');document.getElementById('app').innerHTML=page==='overview'?overview():page==='tasks'?taskPage():page==='assets'?assets():page==='production'?production():page==='report'?report():page==='data'?dataPage():heading('我的频道','把不同频道，放在同一张运营地图里。')+`<div class="card">${channels()}</div><p class="section-note">频道数据为演示内容，尚未连接 YouTube。</p>`}document.getElementById('mobile').onchange=e=>go(e.target.value);function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-cover" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;document.querySelector('.modal input')?.focus()}function closeModal(){document.getElementById('overlay').innerHTML=''}function newTask(stage='待处理'){modal(`<h2>新建创作任务</h2><form onsubmit="event.preventDefault();createTask()"><label class="field">任务名称</label><input id="taskname" required placeholder="例如：完成新视频的分镜"><label class="field">所属频道</label><select id="taskchannel"><option>慢慢生长</option><option>认知之外</option><option>生活提案</option></select><label class="field">截止时间</label><input id="taskdue" type="datetime-local"><label class="field">任务阶段</label><select id="taskstage">${['待处理','制作中','待发布','已完成'].map(s=>`<option ${stage===s?'selected':''}>${s}</option>`).join('')}</select><footer><button type="button" onclick="closeModal()">取消</button><button class="primary">创建任务</button></footer></form>`)}function createTask(){let title=document.getElementById('taskname').value.trim();if(!title)return;let stage=document.getElementById('taskstage').value;tasks.unshift({title,channel:document.getElementById('taskchannel').value,stage,done:stage==='已完成',date:document.getElementById('taskdue').value.replace('T',' ')||'未设置截止时间'});save();closeModal();render();toast('任务已添加')}function editTask(i){const x=tasks[i];modal(`<h2>编辑任务</h2><label class="field">任务名称</label><input id="edittitle" value="${esc(x.title)}"><label class="field">所属频道</label><input id="editchannel" value="${esc(x.channel)}"><label class="field">截止时间</label><input id="editdue" type="datetime-local" value="${/^\d{4}-/.test(x.date)?esc(x.date.replace(' ','T')):''}"><label class="field">任务阶段</label><select id="stageedit">${['待处理','制作中','待发布','已完成'].map(s=>`<option ${x.stage===s?'selected':''}>${s}</option>`).join('')}</select><footer><button onclick="removeTask(${i})">删除任务</button><button onclick="closeModal()">取消</button><button class="primary" onclick="updateTask(${i})">保存修改</button></footer>`)}
function updateTask(i){const title=document.getElementById('edittitle').value.trim();if(!title){toast('请输入任务名称');return}Object.assign(tasks[i],{title,channel:document.getElementById('editchannel').value.trim(),stage:document.getElementById('stageedit').value,date:document.getElementById('editdue').value.replace('T',' ')||'未设置截止时间'});tasks[i].done=tasks[i].stage==='已完成';save();closeModal();render();toast('任务已更新')}

function download(text,name,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadReport(){download('Creator OS 运营周报\n2026.10.12 — 2026.10.18\n\n【演示数据】\n本周发布：13 条\n新增订阅：197 人\n表现优异：3 条\n\n下周行动\n1. 复盘高表现视频\n2. 完成剩余制作任务\n3. 优化频道标题与封面\n\n当前任务\n'+tasks.map(x=>`- [${x.done?'x':' '}] ${esc(x.title)} · ${esc(x.stage)}`).join('\n'),'运营报告.txt');toast('报告已导出')}function autoSaveAsset(){try{localStorage.setItem('creator-asset',JSON.stringify(asset));const status=document.getElementById('assetSaveStatus');if(status)status.textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN')}catch{toast('素材未能保存，请释放浏览器空间并导出备份')}}function saveAsset(){localStorage.setItem('creator-asset',JSON.stringify(asset));toast('发布素材本机工作空间')}async function copyAsset(){try{await navigator.clipboard.writeText(asset.title+'\n\n'+asset.desc+'\n\n'+asset.comment+'\n\n'+(asset.community||'')+'\n\n'+(asset.coverPrompt||''));toast('发布素材已复制')}catch{download(asset.title+'\n'+asset.desc+'\n'+asset.comment,'发布素材.txt');toast('已导出发布素材')}}function previewImage(input){let f=input.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('请选择图片文件');return}let img=document.getElementById('cover');img.src=URL.createObjectURL(f);img.style.display='block'}function exportScenes(){download(JSON.stringify(scenes.map((x,i)=>({scene:i+1,script:x[0],imagePrompt:x[1],videoPrompt:x[2]})),null,2),'视频分镜.json','application/json')}function addScene(){scenes.push(['','','']);Workbench.sync(scenes);render();toast('新分镜已添加')}function openDetail(i){modal(`<h2>${titles[i]}</h2><p>发布后第 ${i+1} 天 · 演示数据</p><div class="value">${['4,793','19,000','2,370','1,128','32,000'][i]} <small>次播放</small></div><p>表现高于频道同期基准。可以在资产工作区调整标题与简介。</p><footer><button onclick="closeModal()">关闭</button><button class="primary" onclick="asset.title=titles[${i}];closeModal();go('assets')">编辑发布素材</button></footer>`)}

function setChannelFilter(v){filter=v;render()}function metrics(){return Workbench.doc.metrics||[]}
function stats(){if(!metrics().length)return '<p class="section-note">以下播放、订阅和发布指标为演示数据，可在数据管理中导入真实数据。</p>'+demoStats();const a=CreatorAnalytics.summarize(metrics());return '<div class="stats">'+[['导入播放量',a.views],['净增订阅',a.subscribers??'未提供'],['视频数量',a.videos],['未完成任务',tasks.filter(x=>!x.done).length]].map(([t,v])=>`<div class="card stat"><div class="stat-top">${t}</div><div class="value">${v}</div><div class="trend">来源：本机导入 · ${metrics().length} 条每日记录</div></div>`).join('')+'</div>'}

function dataPage(){return heading('数据管理','导入每日视频数据，生成基于真实记录的汇总与周报。',btn('下载 CSV 模板','downloadMetricsTemplate()',false,'download')+btn('导入 CSV','importMetrics()',true,'upload'))+`<div class="card pad"><h2>数据来源与口径</h2><p style="margin-top:15px">当前有 ${metrics().length} 条每日视频记录。views 为每日新增播放量；subscribers 为该视频每日净增订阅。不要把累计值当作每日值导入。</p><p style="margin-top:15px">必填：date、channel、title、views。选填：subscribers、revenue、impressions、clicks。收入统一使用同一种货币；缺少字段会显示“未提供”，不会填成 0。</p><p style="margin-top:15px">同一日期、频道、标题标识一条记录。重新导入时更新同名记录，其余保留。数据仅保存在当前浏览器，可通过备份迁移。</p><div class="actions" style="margin-top:20px">${btn('备份工作台','exportBackup()')}${btn('恢复备份','importBackup()')}${btn('清空统计数据','clearMetrics()')}</div></div><section class="card" style="margin-top:22px"><div class="card-head"><h2>已导入视频</h2></div>${metrics().length?videoTable():'<p class="pad">尚未导入数据。</p>'}</section>`}
function downloadMetricsTemplate(){download('date,channel,title,views,subscribers,revenue,impressions,clicks\n2026-10-20,我的频道,示例视频,1200,8,,20000,1000\n2026-10-21,我的频道,示例视频,1600,12,,25000,1250\n','每日视频数据模板.csv','text/csv;charset=utf-8')}
function importMetrics(){const input=document.createElement('input');input.type='file';input.accept='.csv';input.onchange=async()=>{try{if(input.files[0].size>10*1024*1024)throw Error('文件最多 10MB');const rows=CreatorAnalytics.importCSV(await input.files[0].text());const map=new Map(metrics().map(x=>[JSON.stringify([x.date,x.channel,x.title]),x]));for(const x of rows)map.set(JSON.stringify([x.date,x.channel,x.title]),x);Workbench.doc.metrics=[...map.values()];Workbench.save();filter='全部频道';render();toast('已导入 '+rows.length+' 条数据')}catch(e){toast(e.message)}};input.click()}
function clearMetrics(){if(confirm('清空导入的统计数据？任务、分镜和素材会保留。')){Workbench.doc.metrics=[];Workbench.save();render()}}
let reportStart='',reportEnd='';
function report(){if(!metrics().length)return '<div class="notice">尚未导入真实数据，以下为示例周报。请到数据管理导入 CSV。</div>'+demoReport();const dates=metrics().map(x=>x.date).sort();if(!reportEnd)reportEnd=dates.at(-1);if(!reportStart)reportStart=new Date(Date.parse(reportEnd)-6*86400000).toISOString().slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(reportStart)||!/^\d{4}-\d{2}-\d{2}$/.test(reportEnd)||reportStart>reportEnd){reportStart='';reportEnd='';toast('请设置有效的日期范围');return report()}const rows=metrics().filter(x=>x.date>=reportStart&&x.date<=reportEnd),a=CreatorAnalytics.summarize(rows);const prevStart=new Date(Date.parse(reportStart)-(Date.parse(reportEnd)-Date.parse(reportStart)+86400000)).toISOString().slice(0,10);const prev=metrics().filter(x=>x.date>=prevStart&&x.date<reportStart);const coverage=new Set(prev.map(x=>x.date)).size===Math.round((Date.parse(reportEnd)-Date.parse(reportStart))/86400000)+1;const b=CreatorAnalytics.summarize(prev);const growth=coverage&&b.views>0?((a.views/b.views-1)*100).toFixed(1)+'%':'历史日期不完整，无法可靠比较';return heading('运营周报','来源：本机导入的每日视频记录',btn('导出周报','downloadRealReport()',false,'download'))+`<div class="toolbar"><label>开始日期 <input type="date" value="${reportStart}" onchange="reportStart=this.value;render()"></label><label>结束日期 <input type="date" value="${reportEnd}" onchange="reportEnd=this.value;render()"></label></div><div class="card pad report" id="realReport"><h2>${reportStart} — ${reportEnd}</h2><h3>播放量：${a.views.toLocaleString()}</h3><p>与前一等长时间段相比：${growth}</p><h3>订阅净增：${a.subscribers??'未提供'}</h3><h3>视频数：${a.videos} · 频道数：${a.channels}</h3><h3>收入：${a.revenue===null?'未提供':a.revenue.toFixed(2)+'（按导入货币）'}</h3><h3>点击率：${a.ctr===null?'未提供':(a.ctr*100).toFixed(2)+'%'}</h3><p>点击率仅按已导入的 clicks / impressions 计算。未提供收入、曝光或订阅时，不推测相关指标。</p><h3>任务完成度：${tasks.filter(x=>x.done).length} / ${tasks.length}</h3><p>任务完成度为当前全部本机任务状态，不代表所选日期区间。</p></div>`}
function downloadRealReport(){download(document.getElementById('realReport').innerText,'运营周报.txt')}
function sceneStatus(i){const id=Workbench.doc.meta[i]?.id;let session;try{session=JSON.parse(sessionStorage.getItem('creator-api-session')||'null')}catch{}const r=Workbench.doc.meta[i]?.results?.[session?.userId]||{};return ['image','video'].map(k=>r[k]?badge((k==='image'?'图片':'视频')+'：'+({queued:'排队',processing:'生成中',completed:'完成',failed:'失败',unknown:'待确认'}[r[k].status]||r[k].status),r[k].status==='completed'?'green':'amber'):'').join('')||badge('待制作','amber')}
function viewSceneJobs(i){location.href='/generation.html?scene='+encodeURIComponent(Workbench.doc.meta[i].id)}function sendScenes(kind,index){Workbench.sync(scenes);const indices=index===undefined?[...document.querySelectorAll('.scene-select:checked')].map(x=>Number(x.value)):[index];if(!indices.length){toast('请先选择分镜');return}const list=indices.map(i=>({sceneId:Workbench.doc.meta[i].id,sceneNumber:i+1,kind,prompt:scenes[i][kind==='image'?1:2]}));if(list.some(x=>!x.prompt.trim())){toast('请先补齐所选分镜的提示词');return}localStorage.setItem('creator-pending-batch',JSON.stringify(list));location.href='/generation.html?batch=1'}
function deleteScene(i){if(!confirm('删除此分镜？已有生成记录仍保留在生成中心。'))return;scenes.splice(i,1);Workbench.doc.meta.splice(i,1);Workbench.sync(scenes);render()}
function importScenes(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const data=JSON.parse(await input.files[0].text());const rows=data.map(x=>Array.isArray(x)?x:[x.script,x.imagePrompt,x.videoPrompt]);if(!rows.length||rows.length>500||rows.some(x=>x.length!==3||x.some(v=>typeof v!=='string'||v.length>30000)))throw Error('请选择有效的分镜 JSON 文件');scenes.push(...rows);Workbench.sync(scenes);render();toast('分镜已追加导入')}catch(e){toast(e.message)}};input.click()}
function openTextStudio(){localStorage.setItem('creator-text-draft',asset.script);location.href='/generation.html#text'}function exportBackup(){download(JSON.stringify(Workbench.backup(),null,2),'Creator-OS-备份.json','application/json')}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{if(input.files[0].size>10*1024*1024)throw Error('备份不能超过 10MB');const data=JSON.parse(await input.files[0].text());if(!confirm('恢复备份将替换当前任务、分镜、素材和统计数据。继续？'))return;Workbench.restore(data);location.reload()}catch(e){toast(e.message)}};input.click()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
