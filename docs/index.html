<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube 全球赛道分析器</title>
  <style>
    :root{--ink:#172033;--muted:#64748b;--line:#dce2ec;--bg:#f7f8fc;--brand:#4f46e5;--good:#067554;--long:#c2410c;--short:#4338ca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:42px 22px 70px}h1{margin:0 0 10px;font-size:32px}h2{font-size:18px;margin:0 0 16px}p{color:var(--muted);line-height:1.65}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:20px}.controls{display:grid;grid-template-columns:1.5fr repeat(2,.8fr) auto;gap:12px;align-items:end}label{display:grid;gap:6px;font-size:13px;color:var(--muted)}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font:inherit;color:var(--ink)}button{padding:11px 17px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin:14px 0 0;font-size:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border-left:3px solid var(--brand);padding:4px 0 4px 12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font-size:25px;display:block;margin-top:5px}.scoreline{display:grid;grid-template-columns:105px 1fr 42px;gap:12px;align-items:center;margin:12px 0;font-size:14px}.track{height:9px;border-radius:20px;background:#e6e9f1;overflow:hidden}.fill{height:100%;background:var(--brand);border-radius:inherit}.decision{font-size:18px;font-weight:600;margin:12px 0 0}.lanes{margin-top:27px;display:grid;gap:17px}.lane{border:1px solid var(--line);border-radius:12px;overflow:hidden}.lane.long{border-color:#fed7aa}.lane.short{border-color:#c7d2fe}.lane-head{height:48px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;font-weight:600}.long .lane-head{background:#fff7ed;color:var(--long)}.short .lane-head{background:#eef2ff;color:var(--short)}.lane-count{font-size:13px;font-variant-numeric:tabular-nums}.lane-content{position:relative;padding:15px}.lane-scroll{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:1px 1px 8px;scrollbar-width:thin}.opp{flex:0 0 265px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;text-decoration:none;color:var(--ink);position:relative}.opp img{width:100%;height:149px;object-fit:cover;display:block;background:#eef1f7}.rank{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);font-size:13px;font-weight:700}.views{position:absolute;top:121px;left:10px;background:rgba(18,25,38,.8);color:#fff;padding:5px 8px;border-radius:6px;font-size:12px}.opp-body{padding:12px}.opp-title{font-size:14px;line-height:1.45;min-height:41px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.opp-channel{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:8px 0}.opp-stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.signal{color:var(--good);font-weight:600}.scroll-btn{position:absolute;top:50%;transform:translateY(-50%);border-radius:50%;width:36px;height:36px;padding:0;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(23,32,51,.14);z-index:1}.scroll-btn.left{left:-4px}.scroll-btn.right{right:-4px}.note{font-size:13px;margin-top:20px}@media(max-width:700px){.controls,.metrics{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.metrics{gap:18px}.opp{flex-basis:240px}h1{font-size:27px}}@media(max-width:420px){.controls,.metrics{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
  <h1>YouTube 全球赛道分析器</h1><p>使用 YouTube 公开数据，比较不同语言和地区下的赛道需求、增长与竞争。</p>
  <section class="card"><h2>研究一个赛道</h2><div class="controls">
    <label>赛道关键词<input id="query" value="AI productivity" placeholder="例如：budget healthy recipes"></label>
    <label>内容语言<select id="language"><option value="en">英语</option><option value="es">西班牙语</option><option value="pt">葡萄牙语</option><option value="hi">印地语</option><option value="ar">阿拉伯语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="id">印尼语</option><option value="zh-Hans">简体中文</option></select></label>
    <label>市场地区<select id="region"><option value="US">美国</option><option value="BR">巴西</option><option value="IN">印度</option><option value="MX">墨西哥</option><option value="ES">西班牙</option><option value="JP">日本</option><option value="SA">沙特阿拉伯</option><option value="ID">印度尼西亚</option></select></label>
    <button id="analyze">分析赛道</button>
  </div><p id="status" class="status">输入关键词后开始分析。</p></section>
  <section id="result" class="card" hidden><h2 id="title">赛道信号</h2><div class="metrics"><div class="metric"><span>样本视频</span><b id="count">—</b></div><div class="metric"><span>中位播放量</span><b id="views">—</b></div><div class="metric"><span>中位内容年龄</span><b id="age">—</b></div><div class="metric"><span>90 天内新视频</span><b id="recent">—</b></div></div><div id="scores"></div><p class="decision" id="decision"></p><div class="lanes"><section class="lane long"><div class="lane-head"><span>🔥 长内容机会</span><span id="longCount" class="lane-count">0 / 10</span></div><div class="lane-content"><button class="scroll-btn left" data-target="longList" data-delta="-600" aria-label="向左查看长内容">‹</button><div id="longList" class="lane-scroll"></div><button class="scroll-btn right" data-target="longList" data-delta="600" aria-label="向右查看长内容">›</button></div></section><section class="lane short"><div class="lane-head"><span>✦ 短内容机会</span><span id="shortCount" class="lane-count">0 / 10</span></div><div class="lane-content"><button class="scroll-btn left" data-target="shortList" data-delta="-600" aria-label="向左查看短内容">‹</button><div id="shortList" class="lane-scroll"></div><button class="scroll-btn right" data-target="shortList" data-delta="600" aria-label="向右查看短内容">›</button></div></section></div><p class="note">短内容按时长不超过 3 分钟作近似识别。机会卡按播放相对订阅数及发布时间排序，适合快速挑出需要人工验证的选题方向。</p></section>
</main><script src="config.js"></script><script>
  const endpoint=window.YOUTUBE_ANALYZER_API_URL; const $=id=>document.getElementById(id); const nf=new Intl.NumberFormat('zh-CN');
  function score(name,value){return `<div class="scoreline"><span>${name}</span><div class="track"><div class="fill" style="width:${value*10}%"></div></div><b>${value}/10</b></div>`}function compact(n){return n>=1e8?`${(n/1e8).toFixed(1)}亿`:n>=1e4?`${(n/1e4).toFixed(1)}万`:nf.format(n)}function escapeText(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function renderLane(listId,countId,items){$(countId).textContent=`${items.length} / 10`;$(listId).innerHTML=items.map((item,index)=>`<a class="opp" href="${item.videoUrl}" target="_blank" rel="noreferrer"><img src="${item.thumbnail}" alt="${escapeText(item.title)}"><span class="rank">#${index+1}</span><span class="views">◉ ${compact(item.views)}</span><div class="opp-body"><div class="opp-title">${escapeText(item.title)}</div><div class="opp-channel">${escapeText(item.channelTitle)} · 订阅 ${compact(item.subscribers)}</div><div class="opp-stats"><span>${item.ageDays} 天前</span><span class="signal">${item.breakoutRatio.toFixed(1)}× 突破</span></div></div></a>`).join('')||'<p class="note">暂无匹配样本</p>'}document.querySelectorAll('[data-target]').forEach(button=>button.onclick=()=>$(button.dataset.target).scrollBy({left:Number(button.dataset.delta),behavior:'smooth'}));
  $('analyze').onclick=async()=>{const query=$('query').value.trim(),status=$('status'); if(!query){status.textContent='请输入赛道关键词。';return}if(!endpoint||endpoint.includes('YOUR-VERCEL-PROJECT')){status.textContent='尚未连接 Vercel 分析服务。请先在 config.js 填入你的 Vercel 地址。';return}const button=$('analyze');button.disabled=true;status.textContent='正在读取 YouTube 公开数据…';try{const p=new URLSearchParams({query,language:$('language').value,region:$('region').value});const response=await fetch(`${endpoint}?${p}`);const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');const demand=Math.min(10,Math.max(1,Math.round(Math.log10(result.medianViews+1)*1.55)));const growth=Math.min(10,Math.max(1,Math.round(result.recentShare*10)));const competition=Math.min(10,Math.max(1,Math.round(10-result.channelConcentration*10)));$('title').textContent=`${query} · ${$('language').selectedOptions[0].text} / ${$('region').selectedOptions[0].text}`;$('count').textContent=result.videoCount;$('views').textContent=nf.format(result.medianViews);$('age').textContent=`${result.medianAgeDays} 天`;$('recent').textContent=`${Math.round(result.recentShare*100)}%`;$('scores').innerHTML=score('需求信号',demand)+score('增长信号',growth)+score('竞争切入',competition);const total=Math.round((demand*4+growth*3+competition*3)*10);$('decision').textContent=total>=70?`综合信号 ${total}%：建议优先做 10–20 条内容测试。`:total>=50?`综合信号 ${total}%：有机会，但先寻找更细的内容切口。`:`综合信号 ${total}%：暂不建议优先投入，换关键词或市场再验证。`;renderLane('longList','longCount',result.longOpportunities);renderLane('shortList','shortCount',result.shortOpportunities);$('result').hidden=false;status.textContent='分析完成。'}catch(error){status.textContent=`未能分析：${error.message}`}finally{button.disabled=false}};
</script></body></html>
