<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>近期低粉爆款赛道</title>
  <style>
    :root{--ink:#182033;--muted:#667085;--line:#e1e5ef;--bg:#f7f8fc;--brand:#4f46e5;--long:#d65d16;--short:#4338ca;--red:#c53535;--gold:#b7791f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:44px 22px 72px}h1{font-size:37px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:20px;margin:0}.lead{max-width:800px;margin:0;color:var(--muted);line-height:1.7}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.chip{background:#eef2ff;color:#3730a3;border-radius:99px;padding:6px 10px;font-size:13px;font-weight:600}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;margin-top:22px}.controls{display:grid;grid-template-columns:1.45fr repeat(3,.75fr) auto;gap:12px;align-items:end}label{display:grid;gap:6px;font-size:13px;color:var(--muted)}input,select{width:100%;padding:11px;border:1px solid #cdd5e1;border-radius:9px;background:#fff;font:inherit;color:var(--ink)}button{border:0;border-radius:9px;padding:11px 16px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{margin:14px 0 0;min-height:23px;color:var(--muted)}.scope{font-size:13px;color:var(--muted);margin:15px 0 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:19px}.metric{border-left:3px solid var(--brand);padding:5px 0 5px 12px}.metric span{display:block;font-size:12px;color:var(--muted)}.metric b{font-size:27px;line-height:1.3;margin-top:4px;display:block}.scoreline{display:grid;grid-template-columns:112px 1fr 44px;gap:10px;align-items:center;margin:12px 0;font-size:14px}.track{height:9px;border-radius:99px;background:#e6e9f1;overflow:hidden}.fill{height:100%;background:var(--brand);border-radius:inherit}.decision{font-weight:700;font-size:17px;margin:14px 0 0}.actions{display:flex;gap:10px;align-items:center;margin-top:14px}.secondary{background:#eef2ff;color:#3730a3}.saved{font-size:13px;color:var(--muted)}.lanes{display:grid;gap:18px;margin-top:27px}.lane{border:1px solid var(--line);border-radius:13px;overflow:hidden}.lane.long{border-color:#fed7aa}.lane.short{border-color:#c7d2fe}.lane-head{height:50px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700}.long .lane-head{background:#fff7ed;color:var(--long)}.short .lane-head{background:#eef2ff;color:var(--short)}.lane-content{position:relative;padding:15px}.lane-scroll{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:1px 1px 8px}.opp{flex:0 0 270px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;text-decoration:none;color:var(--ink);position:relative}.opp img{height:151px;width:100%;object-fit:cover;display:block;background:#eef1f7}.rank,.viral{position:absolute;top:10px;border-radius:99px;padding:5px 8px;font-size:12px;font-weight:700}.rank{left:10px;background:rgba(255,255,255,.93)}.viral{right:9px;background:rgba(25,30,42,.86);color:#fff}.opp-body{padding:12px}.opp-title{font-size:14px;line-height:1.45;min-height:41px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.opp-channel{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:8px 0}.opp-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.signal{color:#087c58;font-weight:700}.scroll-btn{position:absolute;z-index:2;top:50%;transform:translateY(-50%);height:36px;width:36px;padding:0;border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,25,40,.15)}.left{left:-4px}.right{right:-4px}.empty{margin:2px 12px 9px;color:var(--muted);line-height:1.6;font-size:14px}.compare{display:none}.compare.visible{display:block}.compare-head{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.compare-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.compare-table{margin-top:15px;width:100%;border-collapse:collapse;font-size:14px}.compare-table th,.compare-table td{padding:11px 8px;text-align:left;border-bottom:1px solid var(--line)}.compare-table th{color:var(--muted);font-weight:500;font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;font-weight:700}.remove{padding:4px 6px;color:var(--muted);background:transparent;font-weight:500}@media(max-width:780px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.compare-table{font-size:12px}.compare-table th:nth-child(3),.compare-table td:nth-child(3){display:none}}@media(max-width:440px){.controls,.metrics{grid-template-columns:1fr}h1{font-size:30px}.opp{flex-basis:244px}}
    .insight{margin-top:18px;padding:18px;border:1px solid #c7d2fe;border-radius:12px;background:#f8f9ff}.insight[hidden]{display:none}.insight-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.insight-copy{font-size:12px;color:var(--muted);margin:6px 0 0}.insight-text{white-space:pre-wrap;line-height:1.8;font-size:14px;margin:14px 0 0;color:#252b3b}
  </style>
</head>
<body><main class="wrap">
  <h1>近期低粉爆款赛道</h1>
  <p class="lead">只观察近期发布、频道订阅不超过 10 万、播放超过 100 万的公开视频。用低粉频道的真实爆款，找到更值得切入的赛道。</p>
  <div class="chips"><span class="chip">订阅 ≤ 10 万</span><span class="chip">播放 ≥ 100 万</span><span class="chip">百万 / 千万 / 亿级分层</span><span class="chip">全球语言与市场</span></div>
  <section class="card"><h2>探测一个赛道</h2><div class="controls">
    <label>赛道关键词<input id="query" value="AI productivity" placeholder="例如：home workout for beginners"></label>
    <label>内容语言<select id="language"><option value="en">英语</option><option value="es">西班牙语</option><option value="pt">葡萄牙语</option><option value="hi">印地语</option><option value="ar">阿拉伯语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="id">印尼语</option><option value="zh-Hans">简体中文</option></select></label>
    <label>市场地区<select id="region"><option value="US">美国</option><option value="BR">巴西</option><option value="IN">印度</option><option value="MX">墨西哥</option><option value="ES">西班牙</option><option value="JP">日本</option><option value="SA">沙特阿拉伯</option><option value="ID">印度尼西亚</option></select></label>
    <label>发布时间<select id="recentDays"><option value="30">近 30 天</option><option value="90">近 90 天</option><option value="180" selected>近 180 天</option></select></label>
    <button id="analyze">找低粉爆款</button>
  </div><p id="status" class="status">输入关键词后开始探测。</p></section>
  <section id="result" class="card" hidden>
    <h2 id="title">低粉爆款信号</h2><p id="scope" class="scope"></p>
    <div class="metrics"><div class="metric"><span>低粉爆款样本</span><b id="count">—</b></div><div class="metric"><span>百万级爆款</span><b id="million">—</b></div><div class="metric"><span>千万级大爆款</span><b id="tenMillion">—</b></div><div class="metric"><span>1 亿级以上</span><b id="hundredMillion">—</b></div></div>
    <div id="scores"></div><p id="decision" class="decision"></p>
    <div class="actions"><button id="saveComparison" class="secondary">加入赛道对比</button><span id="saveStatus" class="saved"></span></div>
    <div class="lanes"><section class="lane long"><div class="lane-head"><span>🔥 长视频低粉爆款</span><span id="longCount">0 / 10</span></div><div class="lane-content"><button class="scroll-btn left" data-target="longList" data-delta="-600" aria-label="向左查看">‹</button><div id="longList" class="lane-scroll"></div><button class="scroll-btn right" data-target="longList" data-delta="600" aria-label="向右查看">›</button></div></section><section class="lane short"><div class="lane-head"><span>✦ 短视频低粉爆款</span><span id="shortCount">0 / 10</span></div><div class="lane-content"><button class="scroll-btn left" data-target="shortList" data-delta="-600" aria-label="向左查看">‹</button><div id="shortList" class="lane-scroll"></div><button class="scroll-btn right" data-target="shortList" data-delta="600" aria-label="向右查看">›</button></div></section></div>
  </section>
  <section id="compare" class="card compare"><div class="compare-head"><div><h2>低粉爆款赛道对比</h2><p>保存当前筛选结果，在这台设备上比较赛道的百万、千万、亿级爆款密度。</p></div><button id="clearComparison" class="secondary">清空对比</button></div><div id="comparisonRows"></div></section>
</main><script src="config.js"></script><script>
  const endpoint=window.YOUTUBE_ANALYZER_API_URL,$=id=>document.getElementById(id),nf=new Intl.NumberFormat('zh-CN');
  const compact=n=>n>=1e8?`${(n/1e8).toFixed(1)}亿`:n>=1e4?`${(n/1e4).toFixed(1)}万`:nf.format(n);
  const escapeText=value=>String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const score=(name,value)=>`<div class="scoreline"><span>${name}</span><div class="track"><div class="fill" style="width:${value*10}%"></div></div><b>${value}/10</b></div>`;
  function renderLane(listId,countId,items,message){$(countId).textContent=`${items.length} / 10`;$(listId).innerHTML=items.map((item,index)=>`<a class="opp" href="${item.videoUrl}" target="_blank" rel="noreferrer"><img src="${item.thumbnail}" alt="${escapeText(item.title)}"><span class="rank">#${index+1}</span><span class="viral">${item.viralLabel}</span><div class="opp-body"><div class="opp-title">${escapeText(item.title)}</div><div class="opp-channel">${escapeText(item.channelTitle)} · 订阅 ${compact(item.subscribers)}</div><div class="opp-stats"><span>◉ ${compact(item.views)} · ${item.ageDays} 天前</span><span class="signal">${item.breakoutRatio.toFixed(1)}×</span></div></div></a>`).join('')||`<p class="empty">${escapeText(message)}</p>`}
  document.querySelectorAll('[data-target]').forEach(button=>button.onclick=()=>$(button.dataset.target).scrollBy({left:Number(button.dataset.delta),behavior:'smooth'}));
  $('analyze').onclick=async()=>{const query=$('query').value.trim(),status=$('status'),button=$('analyze');if(!query){status.textContent='请输入赛道关键词。';return}if(!endpoint||endpoint.includes('YOUR-VERCEL-PROJECT')){status.textContent='尚未连接 Vercel 分析服务。';return}button.disabled=true;status.textContent='正在筛选近期低粉爆款…';try{const p=new URLSearchParams({query,language:$('language').value,region:$('region').value,recentDays:$('recentDays').value});const response=await fetch(`${endpoint}?${p}`),result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');const counts=result.viralCounts||{million:0,tenMillion:0,hundredMillion:0,billion:0};const demand=Math.min(10,Math.max(1,Math.round(1+Math.log10(counts.million+1)*2+Math.log10(counts.tenMillion+1)*3+Math.log10(counts.hundredMillion+1)*3)));const freshness=Math.min(10,Math.max(1,Math.round(10-(result.medianAgeDays||result.recentDays)/result.recentDays*7)));const scarcity=Math.min(10,Math.max(1,Math.round(10-(result.channelConcentration||0)*5)));const total=Math.round(demand*4+freshness*3+scarcity*3);$('title').textContent=`${query} · ${$('language').selectedOptions[0].text} / ${$('region').selectedOptions[0].text}`;$('scope').textContent=`筛选：近 ${result.recentDays} 天 · 订阅 ≤ ${compact(result.maxSubscribers)} · 播放 ≥ ${compact(result.minimumViews)}`;$('count').textContent=result.videoCount;$('million').textContent=counts.million;$('tenMillion').textContent=counts.tenMillion;$('hundredMillion').textContent=counts.hundredMillion;$('scores').innerHTML=score('爆款密度',demand)+score('新鲜程度',freshness)+score('低粉切入',scarcity);$('decision').textContent=result.videoCount?`低粉爆款信号 ${total}%：${total>=70?'值得优先拆解标题、选题与节奏。':total>=50?'有机会，建议继续细分关键词验证。':'样本偏少，扩大时间或更换关键词。'}`:'当前没有符合筛选条件的样本。';window.latestAnalysis={id:String(Date.now()),query,language:$('language').selectedOptions[0].text,region:$('region').selectedOptions[0].text,recentDays:result.recentDays,total,videoCount:result.videoCount,million:counts.million,tenMillion:counts.tenMillion,hundredMillion:counts.hundredMillion};$('saveStatus').textContent='';renderLane('longList','longCount',result.longOpportunities,result.noCandidatesMessage);renderLane('shortList','shortCount',result.shortOpportunities,result.noCandidatesMessage);$('result').hidden=false;status.textContent='筛选完成。'}catch(error){status.textContent=`未能分析：${error.message}`}finally{button.disabled=false}};
</script><script>
  const compareKey='low-subscriber-viral-niches-v1',readCompare=()=>{try{return JSON.parse(localStorage.getItem(compareKey)||'[]')}catch{return[]}},writeCompare=items=>localStorage.setItem(compareKey,JSON.stringify(items));
  function renderCompare(){const items=readCompare();$('compare').classList.toggle('visible',items.length>0);if(!items.length){$('comparisonRows').innerHTML='';return}$('comparisonRows').innerHTML=`<table class="compare-table"><thead><tr><th>赛道</th><th>语言 / 市场</th><th>时间</th><th>百万+</th><th>千万+</th><th>亿级+</th><th>潜力</th><th></th></tr></thead><tbody>${[...items].sort((a,b)=>b.total-a.total).map(item=>`<tr><td><b>${escapeText(item.query)}</b></td><td>${escapeText(item.language)} / ${escapeText(item.region)}</td><td>${item.recentDays} 天</td><td>${item.million}</td><td>${item.tenMillion}</td><td>${item.hundredMillion}</td><td><span class="pill">${item.total}%</span></td><td><button class="remove" data-remove="${item.id}">删除</button></td></tr>`).join('')}</tbody></table>`;$('comparisonRows').querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{writeCompare(readCompare().filter(item=>item.id!==button.dataset.remove));renderCompare()})}
  $('saveComparison').onclick=()=>{if(!window.latestAnalysis)return;const items=readCompare().filter(item=>!(item.query===window.latestAnalysis.query&&item.language===window.latestAnalysis.language&&item.region===window.latestAnalysis.region&&item.recentDays===window.latestAnalysis.recentDays));items.unshift(window.latestAnalysis);writeCompare(items.slice(0,20));renderCompare();$('saveStatus').textContent='已加入对比。'};$('clearComparison').onclick=()=>{localStorage.removeItem(compareKey);renderCompare()};renderCompare();
</script><script>
  const gptEndpoint=window.YOUTUBE_ANALYZER_GPT_URL||'https://youtube-niche-global-api.vercel.app/api/gpt-insight';
  const gptAction=document.createElement('div');gptAction.className='actions';gptAction.innerHTML='<button id="gptInsight">GPT 解读赛道</button><span id="gptStatus" class="saved"></span>';
  document.querySelector('#result .lanes').before(gptAction);
  const insight=document.createElement('section');insight.id='insight';insight.className='insight';insight.hidden=true;insight.innerHTML='<div class="insight-head"><div><h2>GPT 赛道解读</h2><p class="insight-copy">仅基于本次筛选出的公开视频样本生成；密钥只保存在服务器。</p></div></div><div id="insightText" class="insight-text"></div>';
  document.querySelector('#result .lanes').before(insight);
  const visibleSamples=()=>[...document.querySelectorAll('.opp')].slice(0,12).map(card=>({title:card.querySelector('.opp-title')?.textContent||'',channelTitle:card.querySelector('.opp-channel')?.textContent||'',stats:card.querySelector('.opp-stats')?.textContent||'',viralLabel:card.querySelector('.viral')?.textContent||'',format:card.closest('.short')?'short':'long'}));
  $('gptInsight').onclick=async()=>{const button=$('gptInsight'),status=$('gptStatus');if(!window.latestAnalysis){status.textContent='请先完成一次赛道筛选。';return}if(!gptEndpoint){status.textContent='GPT 服务尚未连接。';return}button.disabled=true;button.textContent='GPT 正在解读…';insight.hidden=false;$('insightText').textContent='正在根据本次公开样本生成赛道结论…';try{const analysis={...window.latestAnalysis,samples:visibleSamples()};const response=await fetch(gptEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analysis})}),result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');$('insightText').textContent=result.insight;status.textContent='已生成。'}catch(error){$('insightText').textContent=`暂时无法生成 GPT 解读：${error.message}`;status.textContent=''}finally{button.disabled=false;button.textContent='GPT 解读赛道'}};
</script></body></html>
